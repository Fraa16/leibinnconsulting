    <!--
      Self-hosted fonts. Preloading the two latin faces used above the fold means
      the first paint already has them, instead of swapping mid-read.
    -->
    <link
      rel="preload"
      href="/fonts/playfair-display-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The hero photograph is still served by Pexels; warm the connection early. -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
